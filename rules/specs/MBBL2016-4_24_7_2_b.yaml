unit_id: "MBBL2016-4.24.7.2#b"
clause_id: MBBL2016-4.24.7.2
unit_text: No exit doorways shall be less than 1m in width
topic: door width
template: door_width_min
params:
  selector: {pset: Pset_DoorCommon, property: FireExit, value: true}
threshold: {value: 1.0, text: "1", unit: m, inclusive: true}
duplicate_of: "MBBL2016-5.4.1#b"
notes_for_reviewer: >-
  Exit doors (Pset_DoorCommon.FireExit = TRUE) must have Qto_DoorBaseQuantities.Width of at least 1 m. Inclusive
  ("not less than"). NOT encoded: "except assembly and institutional buildings where Doorway shall not be less than
  2 m" (building type is not checked, so a 1.5 m exit in an assembly building passes). Duplicates MBBL2016-5.4.1#b.
  Clear vs leaf vs overall width is not specified.
