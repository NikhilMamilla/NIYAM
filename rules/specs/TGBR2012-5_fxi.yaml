unit_id: "TGBR2012-5#fxi"
clause_id: TGBR2012-5
unit_text: Where the lighting and ventilation of a building is through the means of a chowk or inner courtyard or interior open space / duct, such open space shall be open to sky and of area at least 9sq.m and no side shall be less than 2m.
topic: room area
template: space_area_min
dev_length_unit: m
params:
  categories: [Chowk, Courtyard]
threshold: {value: 9, text: "9", unit: m2, inclusive: true}
notes_for_reviewer: >-
  Telangana Building Rules 2012 (G.O.Ms.No.168, original text, amendments not applied), Rule 5(f)(xi). Chowk or
  inner-courtyard spaces (Pset_SpaceCommon.Category Chowk or Courtyard, assumed names) must have a floor area of at
  least 9 sq.m; "at least" is inclusive. NOT encoded: (1) "no side shall be less than 2m" (no width helper);
  (2) "open to sky"; (3) the condition that lighting and ventilation are through this space: every Chowk or
  Courtyard space is checked; (4) ducts and "interior open space" without one of the two Category values;
  (5) Rule 5's heading (non-high-rise buildings below 18m). Rule 7(a)(xv) requires 25sq.m and 3m for high-rise
  buildings; that unit is not created because without its heading it would fail non-high-rise buildings, while this
  9sq.m minimum also holds for high-rise buildings (25 >= 9).
