- id: MBBL2016-4.17.2#A
  clause_id: MBBL2016-4.17.2
  text: 'The minimum width of staircase shall be as follows: A Residential buildings (dwellings) 1.0 m'
  tier: geometric
  status: pilot
  expected_artifact: fixtures/checks/MBBL2016-4_17_2_A.py
  human_reviewed: false
  reviewer: null
  notes: 'IfcStairFlight in an IfcBuilding with Pset_BuildingCommon.OccupancyType=Residential: flight
    width (local Y extent of the flight geometry) >= 1.0 m. Ambiguity: ''width of staircase'' taken as
    flight width, not clear width between handrails; other building types (1.5 m, 2.0 m) and the row-housing
    note (0.75 m) are not encoded; flights in other occupancy types are out of scope.'
- id: MBBL2016-4.3.1.1#1
  clause_id: MBBL2016-4.3.1.1
  text: The height of all rooms for human habitation shall not be less than 2.75 m measured from the surface
    of the floor to the lowest point of the ceiling (bottom of slab)
  tier: geometric
  status: pilot
  expected_artifact: fixtures/checks/MBBL2016-4_3_1_1_1.py
  human_reviewed: false
  reviewer: null
  notes: 'IfcSpace with Pset_SpaceCommon.Category=Habitable: vertical extent of the space geometry (floor
    to underside of slab) >= 2.75 m. Ambiguity: assumes the modelled space spans floor surface to slab
    soffit; the beam (2.4 m), pitched-roof (average height) and air-conditioned (2.4 m) provisions in
    the following sentences are not encoded; applies to residential/business/mercantile only (4.3.1.2),
    building type not checked.'
- id: MBBL2016-4.5.2#1
  clause_id: MBBL2016-4.5.2
  text: The area of a bathroom shall not be less than 1.8 m2
  tier: geometric
  status: pilot
  expected_artifact: fixtures/checks/MBBL2016-4_5_2_1.py
  human_reviewed: false
  reviewer: null
  notes: 'IfcSpace with Pset_SpaceCommon.Category=Bathroom: floor area computed from the space geometry
    (down-facing faces of the body mesh) >= 1.8 m2. Ambiguity: the same sentence adds ''with a minimum
    width of 1.2 m'' (not encoded: width of a non-rectangular footprint is not defined by the clause);
    ''bathroom'' is mapped to the Category convention; geometric area vs declared Qto NetFloorArea not
    distinguished by the clause.'
- id: MBBL2016-5.4.1#b
  clause_id: MBBL2016-5.4.1
  text: No exit doorway shall be less than 1m in width.
  tier: ids
  status: pilot
  expected_artifact: fixtures/ids/MBBL2016-5_4_1_b.ids
  human_reviewed: false
  reviewer: null
  notes: 'IfcDoor with FireExit=TRUE: Qto_DoorBaseQuantities.Width >= 1.0 m. Uses the quantity, not OverallWidth:
    IDS attribute bounds are not unit-converted (see docs/notes-ids-expressiveness.md). Ambiguity: clear
    vs leaf vs overall width not specified.'
- id: MBBL2016-5.4.1#c
  clause_id: MBBL2016-5.4.1
  text: overhead or sliding doors shall not be installed
  tier: ids
  status: pilot
  expected_artifact: fixtures/ids/MBBL2016-5_4_1_c.ids
  human_reviewed: false
  reviewer: null
  notes: 'IfcDoor with FireExit=TRUE: OperationType not in {SLIDING_TO_LEFT, SLIDING_TO_RIGHT, DOUBLE_DOOR_SLIDING,
    ROLLINGUP}. Ambiguity: scope (exit doorways) inferred from sub-item c; ''overhead'' mapped to ROLLINGUP
    only; fragment of a comma-spliced sentence whose first half (0.9m landing width) is geometric.'
- id: MBBL2016-5.4.2#1
  clause_id: MBBL2016-5.4.2
  text: Revolving door shall not be provided as a means of fire exit.
  tier: ids
  status: pilot
  expected_artifact: fixtures/ids/MBBL2016-5_4_2_1.ids
  human_reviewed: false
  reviewer: null
  notes: 'IfcDoor with Pset_DoorCommon.FireExit=TRUE: OperationType must not be REVOLVING. Ambiguity:
    ''means of fire exit'' is mapped to the FireExit flag.'
