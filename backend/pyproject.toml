[project]
name = "niyam-backend"
version = "0.1.0"
description = "NIYAM backend: IDS compilation, IFC auditing, BCF export"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ifcopenshell==0.9.0.post1",
    "ifctester==0.9.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
